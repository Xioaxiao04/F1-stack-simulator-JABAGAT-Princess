
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Queue Data Structure Simulator</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.3.min.js"></script>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container mt-4 mb-4">

        <h1 class="text-center p-3 mb-4">
            Queue Data Structure Simulator
        </h1>

        <div class="row text-center column-headings py-3">
            <div class="col-md-4">Operations</div>
            <div class="col-md-4">Queue Data</div>
            <div class="col-md-4">Deleted from Queue</div>
        </div>

        <div class="row simulator-area g-3 p-3">

            <!-- Operations -->
            <div class="col-md-4">
                <div class="operations-panel d-grid gap-2 p-2">

                    <input type="text" id="data"
                        class="form-control text-center"
                        placeholder="Enter data">

                    <button id="enqueueBtn" class="btn btn-success">
                        Enqueue
                    </button>

                    <button id="dequeueBtn" class="btn btn-danger">
                        Dequeue
                    </button>

                    <button id="peekBtn" class="btn btn-warning">
                        Peek
                    </button>

                    <button id="clearBtn" class="btn btn-light">
                        Clear
                    </button>

                </div>
            </div>

            <!-- Queue Display -->
            <div class="col-md-4">
                <div class="queue-panel">
                    <p class="front-label">FRONT ↓</p>

                    <div id="queueDisplay" class="queue-display">
                        <p class="empty-message">Queue is empty</p>
                    </div>

                    <p class="rear-label">REAR ↓</p>
                </div>
            </div>

            <!-- Deleted Display -->
            <div class="col-md-4">
                <div class="deleted-panel">
                    <p class="deleted-heading">Deleted Element</p>

                    <div id="deleted" class="deleted-value">
                        None
                    </div>
                </div>
            </div>

        </div>

        <!-- Status Message -->
        <div id="message" class="alert alert-info text-center mt-3">
            Welcome to Queue Simulator!
        </div>

    </div>

    <script src="queue.js"></script>
</body>
</html>
